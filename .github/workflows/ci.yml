name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: black --check
        run: uv run black --check --diff .

  type:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --extra pdf
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # WeasyPrint needs pango/harfbuzz; the pdf extra is installed so the render and signing
      # paths are covered by the gate. No network and no secrets are needed by the tests.
      - name: Native libraries for WeasyPrint
        run: >-
          sudo apt-get update -q &&
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --dev --extra pdf
      - name: pytest + coverage (gate 90%)
        run: >
          uv run pytest
          --cov=isms_as_code --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  content:
    name: Content (validate, drift, changelog, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Validate documents, control guides and registers
        run: uv run isms validate
      - name: Generated artefacts are in sync with the sources
        run: uv run isms generate --check
      - name: Changed documents carry a CHANGELOG entry and a version bump
        if: github.event_name == 'pull_request'
        run: uv run isms changelog-check --base ${{ github.event.pull_request.base.sha }}
      - name: yamllint
        run: uv run yamllint -s .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !.venv

  build:
    name: Build (render, sign, verify)
    runs-on: ubuntu-latest
    needs: [content]
    env:
      SOURCE_DATE_EPOCH: "1787184000"
      # Optional: a real document-control key. Without it the build signs with an ephemeral,
      # clearly labelled development key so forks and pull requests still exercise the pipeline.
      ISMS_SIGNING_P12: ${{ secrets.ISMS_SIGNING_P12 }}
      ISMS_SIGNING_PASSPHRASE: ${{ secrets.ISMS_SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Native libraries for WeasyPrint
        run: >-
          sudo apt-get update -q &&
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --dev --extra pdf
      - name: validate -> generate -> render -> sign -> manifest -> verify
        run: uv run isms build --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: isms-documents-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --extra pdf
      - name: pip-audit (report-only)
        run: uv run pip-audit || true
