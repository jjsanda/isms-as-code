name: Review reminders

# Every Monday: open an issue for each document or control assessment that is due within 60 days
# (or overdue), assigned by label to the owner role. Idempotent — an open issue with the same title
# is not duplicated.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    name: Open review-due issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: Compute what is due
        run: uv run isms review-due --within 60 --format json > due.json
      - name: Open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run python scripts/open_review_issues.py due.json
