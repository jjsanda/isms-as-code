# ISO/IEC 27001:2022 Annex A — reference catalogue of the 93 controls.
#
# Only the control identifiers and titles are taken from the standard. The attribute values follow the
# attribute table of ISO/IEC 27002:2022 (control type, information security properties, cybersecurity
# concepts) and the new_in_2022 flag marks the 11 controls introduced with the 2022 revision. No
# descriptive text of the standard is reproduced anywhere in this repository; every objective and
# implementation guidance under isms/controls/ is original. Obtain the standard from ISO/IEC or your
# national standards body.
standard: "ISO/IEC 27001:2022 Annex A"
source_note: >-
  Control identifiers and titles per ISO/IEC 27001:2022 Annex A; attributes per ISO/IEC 27002:2022.
  Verify attribute values against the published standard before relying on them for reporting.
